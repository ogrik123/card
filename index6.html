<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="idex6.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index 5</title>
</head>
<body>
<div class="card_iphone">
    <div class="card_image">
        <img src="js_image/phone.png" width="250">
    </div>

    <div class="card_info">
        <h3>Айфон 15 чёрный</h3>
        <div class="size">
            <h5>объём <br> памяти</h5>
            <button class="btn medium active ">
                256
            </button>
            <button class="btn large">
                512
            </button>
        </div>
        <div class="counter">
            <button id="minus">
                -
            </button>
            <h3 id="value">1</h3>
            <button id="plus">
                +
            </button>
            <h3 class="price">1500$</h3>
        </div>
        <div>
            <button id="buy">Купить</button>
        </div>
    </div>
</div>
<script src="script8.js"></script>
</body>
</html>
